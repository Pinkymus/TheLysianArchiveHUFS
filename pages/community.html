<!DOCTYPE html>
<html>

<head>
    <title>The Lysian Archive</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style.css">
    <script src="/components.js"></script>
    <script src="/dataaccess.js"></script>
    <script src="/login_controller.js"></script>
    <script src="/controller.js"></script>
</head>

<body>
    <header id="header"></header>

    <main>
        <section>
            <div class="carousel">
                <article id="featured-submission" 
                    class="main-section container" style="flex: 1;">
                </article>

                <div id="featured"
                    class="main-section" style="padding: 0; flex: 3; overflow: hidden;">
                </div>

                <article id="featured-artist"
                    class="main-section" style="flex: 1;">
                </article>
            </div>
        </section>

        <section id="fanart" class="main-section" style="text-align: center;">
            <h2>Fan Art</h2>
            <p>These are all images that can also be found on Unvale, made by our talented community members.</p>
            <div id="fanart-gallery" class="fanart-gallery"></div>
        </section>

        <section id="member-content" class="main-section" style="text-align: center;">
            <h2>Member Content</h2>
            <p> &#x1F512; Login required to view member-only content. &#x1F512; </p>
        </section>
    </main>

    <div id="footer"></div>
    <script> 
        loadHeader()
        loadFooter(); 
        loadFeaturedApply();
        loadFeaturedFanart();
        loadFanart();
    </script>
</body>

</html>

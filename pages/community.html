<!DOCTYPE html>
<html>
    <head>
        <title>The Lysian Archive</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../style.css">
        <style>
            /* All styling will be moved into the proper file later */
            img {
                max-width: 100%;
                max-height: 400px;
            }
            img:hover {
                transform: scale(1.05);
                transition: transform 0.3s ease;
                cursor: pointer;
                box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            }
        </style>
    </head>
    <body>
        <header style="background-image: url('/images/banner-image-1.webp'); background-size: cover; height: 300px;">
            <h1>Community</h1>
            <div id="navbar"></div>
            <script>
                fetch("../components/navigationbar.html")
                    .then(response => response.text())
                    .then(html => {
                        document.getElementById("navbar").innerHTML = html;
                        document.getElementById("community-link").classList.add("active");
                    });
            </script>
        </header>


        <main>
            <section id="fanart">
                <h2>Fan Art</h2>
                <p>These are all images that can also be found on Unvale, made by our talented community members.</p>
                <div style="
                    display: flex; 
                    flex-wrap: wrap; 
                    align-items: center; 
                    gap: 20px; 
                    margin: 100px;">
                    <img src="../images/fanart/Hannah-fanart.webp" alt="Katharina by Hannah">
                    <img src="../images/fanart/Queen-of-stars-fanart-Katharina.webp" alt="Katharina by Queen of Stars">
                    <img src="../images/fanart/meikaseeka-fanart-katharina.webp" alt="Katharina by Meikaseeka">
                    <img src="../images/fanart/glicheeB-fanart-leopold.webp" alt="Leopold by glicheeB">
                    <img src="../images/fanart/Hannah-fanart-leopold.webp" alt="Leopold by Hannah">
                    <img src="../images/fanart/Asg0-fanart-Leopold.webp" alt="Leopold by Asg0">
                </div>
            </section>

            <section id="member-content">
                <h2>Member Content</h2>
                <p> &#x1F512; Login required to view member-only content. &#x1F512; </p>
            </section>
        </main>

        <div id="footer"></div>
        <script> getFooter() </script>
    </body>
</html>
